<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Simple readerv3</title>

<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>

<style>
:root {
--bg-color: #000000;
--text-color: #e0e0e0;
--panel-bg: #000000;
--border-color: #222222;
--font-size: 26px;
--line-height: 1.4;
}

*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html {
scroll-behavior: auto !important;
background-color: var(--bg-color);
}

body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
min-height: 100vh;
overflow-x: hidden;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}

/* 揭頁模式下的 body 鎖定 */
body.paged-mode {
overflow: hidden;
height: 100vh;
height: 100dvh;
}

/* 雙行頂部工具列 */
.toolbar {
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 100;
background-color: #000000;
border-bottom: 1px solid var(--border-color);
display: flex;
flex-direction: column;
gap: 6px;
padding: calc(env(safe-area-inset-top) + 8px) 10px 8px 10px;
transition: transform 0.2s ease;
}

.toolbar.hidden {
transform: translateY(-100%);
}

.toolbar-row {
display: flex;
flex-wrap: wrap;
gap: 6px;
align-items: center;
width: 100%;
}

.btn {
background-color: #1a1a1a;
color: var(--text-color);
border: 1px solid var(--border-color);
padding: 5px 9px;
border-radius: 6px;
font-size: 12px;
cursor: pointer;
user-select: none;
flex-shrink: 0;
transition: background-color 0.15s, border-color 0.15s, color 0.15s;
}

.btn:active {
opacity: 0.6;
}

.btn.active-opt {
background-color: #1b3a1e;
color: #4CAF50;
border-color: #4CAF50;
font-weight: bold;
}

.col-group {
display: inline-flex;
gap: 4px;
align-items: center;
margin-left: 2px;
padding-left: 6px;
border-left: 1px solid #333;
}

.progress-btn {
background-color: #1a1a1a;
color: #4CAF50;
border: 1px solid #4CAF50;
font-weight: bold;
flex-shrink: 0;
font-size: 12px;
padding: 5px 8px;
}

/* 進度滑桿容器 */
.progress-slider-container {
display: flex;
align-items: center;
flex: 1;
min-width: 100px;
}

.progress-slider {
width: 100%;
height: 4px;
-webkit-appearance: none;
appearance: none;
background: #222;
border-radius: 2px;
outline: none;
}

.progress-slider::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 16px;
height: 16px;
border-radius: 50%;
background: #4CAF50;
cursor: pointer;
}

input[type="file"] {
display: none;
}

/* 滾動模式文章內容區塊 */
.content-container {
width: 100%;
padding: calc(env(safe-area-inset-top) + 95px) 16px calc(env(safe-area-inset-bottom) + 60px) 16px;
font-size: var(--font-size);
line-height: var(--line-height);
word-break: break-word;
white-space: pre-wrap;
transform: translateZ(0);
}

/* 揭頁模式外層視窗與多欄分頁容器 */
.paged-viewport {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
height: 100dvh;
padding: calc(env(safe-area-inset-top) + 32px) 36px calc(env(safe-area-inset-bottom) + 36px) 36px;
overflow: hidden;
box-sizing: border-box;
}

.paged-viewport .content-container {
padding: 0;
height: 100%;
width: 100%;
column-fill: auto;
-webkit-column-fill: auto;
column-rule: 1px solid #1f1f1f;
-webkit-column-rule: 1px solid #1f1f1f;
will-change: transform;
}

/* 揭頁模式底部微弱頁碼提示 */
.page-indicator {
position: fixed;
bottom: calc(env(safe-area-inset-bottom) + 10px);
right: 36px;
font-size: 12px;
color: #555;
pointer-events: none;
z-index: 50;
display: none;
user-select: none;
}

body.paged-mode .page-indicator {
display: block;
}

.loading-status {
font-size: 11px;
color: #aaa;
flex-shrink: 0;
}

/* 浮動通知提示框 */
.toast-notice {
position: fixed;
top: calc(env(safe-area-inset-top) + 100px);
right: 20px;
background-color: rgba(30, 30, 30, 0.95);
color: #fff;
padding: 8px 14px;
border-radius: 8px;
font-size: 13px;
z-index: 300;
border: 1px solid #444;
pointer-events: none;
opacity: 0;
transition: opacity 0.2s ease;
}
.toast-notice.show {
opacity: 1;
}

/* 通用側邊欄抽屜 */
.drawer-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.6);
z-index: 200;
display: flex;
justify-content: flex-start;
align-items: stretch;
opacity: 0;
visibility: hidden;
transition: opacity 0.2s ease, visibility 0.2s ease;
}

.drawer-modal.active {
opacity: 1;
visibility: visible;
}

.drawer-content {
background-color: #000000;
width: 50%;
max-width: 420px;
height: 100%;
border-right: 1px solid #333;
display: flex;
flex-direction: column;
box-shadow: 4px 0 15px rgba(0,0,0,0.5);
transform: translateX(-100%);
transition: transform 0.25s ease;
}

.drawer-modal.active .drawer-content {
transform: translateX(0);
}

.drawer-header {
padding: 14px 16px;
border-bottom: 1px solid #222;
display: flex;
justify-content: space-between;
align-items: center;
font-weight: bold;
font-size: 15px;
color: #fff;
background-color: #000000;
}

.drawer-close {
background: none;
border: none;
color: #aaa;
font-size: 18px;
cursor: pointer;
}

.drawer-list {
flex: 1;
overflow-y: auto;
padding: 4px 0;
-webkit-overflow-scrolling: touch;
}

.drawer-item {
padding: 12px 16px;
font-size: 13px;
color: #ccc;
border-bottom: 1px solid #1a1a1a;
cursor: pointer;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display: flex;
justify-content: space-between;
align-items: center;
}

.drawer-item:hover, .drawer-item:active {
background-color: #222;
color: #fff;
}

.drawer-empty {
padding: 30px;
text-align: center;
color: #666;
font-size: 13px;
}

.item-subtext {
font-size: 11px;
color: #777;
flex-shrink: 0;
}

.delete-btn {
background: #331111;
color: #ff6666;
border: 1px solid #552222;
padding: 2px 6px;
border-radius: 4px;
font-size: 11px;
cursor: pointer;
margin-left: 8px;
flex-shrink: 0;
}
.delete-btn:active {
background: #551111;
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
    <div class="toolbar-row">
        <label class="btn" for="fileInput">📁 開啟檔案</label>
        <input type="file" id="fileInput" accept=".txt,.html,.md,.text">

        <button class="btn" id="shelfBtn">📚 書架</button>
        <button class="btn" id="tocBtn" style="display:none;">📑 目錄</button>
        <button class="btn" id="fontIncBtn">字體+</button>
        <button class="btn" id="fontDecBtn">字體-</button>
        <button class="btn" id="lineIncBtn">行距+</button>
        <button class="btn" id="lineDecBtn">行距-</button>

        <button class="btn" id="modeToggleBtn">模式: 滾動</button>
        <div class="col-group" id="colSelectorGroup" style="display:none;">
            <button class="btn col-btn" data-cols="1">1欄</button>
            <button class="btn col-btn" data-cols="2">2欄</button>
            <button class="btn col-btn" data-cols="3">3欄</button>
            <button class="btn col-btn" data-cols="4">4欄</button>
        </div>
    </div>

    <div class="toolbar-row">
        <button class="btn progress-btn" id="progressBtn">0.00%</button>
        <div class="progress-slider-container">
            <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" step="0.1" value="0">
        </div>
        <span class="loading-status" id="statusText"></span>
    </div>
</div>

<div id="readerViewport">
    <div class="content-container" id="textContent">
請點擊上方「開啟檔案」或從「書架」載入文章...
    </div>
</div>

<div class="page-indicator" id="pageIndicator">1 / 1</div>
<div class="toast-notice" id="toastNotice"></div>

<div class="drawer-modal" id="tocModal">
    <div class="drawer-content">
        <div class="drawer-header">
            <span>章節</span>
            <button class="drawer-close" id="tocClose">&times;</button>
        </div>
        <div class="drawer-list" id="tocList"></div>
    </div>
</div>

<div class="drawer-modal" id="shelfModal">
    <div class="drawer-content">
        <div class="drawer-header">
            <span>書架</span>
            <button class="drawer-close" id="shelfClose">&times;</button>
        </div>
        <div class="drawer-list" id="shelfList"></div>
    </div>
</div>

<script>
const DB_NAME = 'SimpleReaderDB';
const STORE_NAME = 'books';
let db = null;

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
                database.createObjectStore(STORE_NAME, { keyPath: 'key' });
            }
        };
    });
}

function saveBookToDB(key, name, content) {
    if (!db) return;
    try {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ key, name, content, updatedAt: Date.now() });
    } catch(e) {}
}

function getAllBooksFromDB() {
    return new Promise((resolve) => {
        if (!db) return resolve([]);
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
    });
}

function deleteBookFromDB(key) {
    return new Promise((resolve) => {
        if (!db) return resolve();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const req = tx.objectStore(STORE_NAME).delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => resolve();
    });
}

let currentFontSize = parseFloat(localStorage.getItem('reader_font_size')) || 26;
let currentLineHeight = parseFloat(localStorage.getItem('reader_line_height')) || 1.4;
let readingMode = localStorage.getItem('reader_mode') || 'scroll'; // 'scroll' | 'paged'
let columnCount = parseInt(localStorage.getItem('reader_columns')) || 2;

document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
document.documentElement.style.setProperty('--line-height', currentLineHeight);

const converter = window.OpenCC ? window.OpenCC.Converter({ from: 'cn', to: 'hk' }) : text => text;

function formatQuotes(text) {
    return text
        .replace(/“/g, '「').replace(/”/g, '」')
        .replace(/‘/g, '『').replace(/’/g, '』')
        .replace(/"([^"]+)"/g, '「$1」')
        .replace(/'([^']+)'/g, '『$1』');
}

const toolbar = document.getElementById('toolbar');
const readerViewport = document.getElementById('readerViewport');
const textContent = document.getElementById('textContent');
const fileInput = document.getElementById('fileInput');
const progressBtn = document.getElementById('progressBtn');
const progressSlider = document.getElementById('progressSlider');
const statusText = document.getElementById('statusText');
const toastNotice = document.getElementById('toastNotice');
const pageIndicator = document.getElementById('pageIndicator');

const modeToggleBtn = document.getElementById('modeToggleBtn');
const colSelectorGroup = document.getElementById('colSelectorGroup');
const colBtns = document.querySelectorAll('.col-btn');

const shelfBtn = document.getElementById('shelfBtn');
const tocBtn = document.getElementById('tocBtn');

const shelfModal = document.getElementById('shelfModal');
const shelfClose = document.getElementById('shelfClose');
const shelfList = document.getElementById('shelfList');

const tocModal = document.getElementById('tocModal');
const tocClose = document.getElementById('tocClose');
const tocList = document.getElementById('tocList');

let isUserDraggingSlider = false;
let currentFileKey = null;
let chapterElements = [];
let toastTimer = null;

// 揭頁模式分頁狀態
let currentPage = 0;
let totalPages = 1;
let pageStepWidth = 0;

function showToast(msg) {
    toastNotice.textContent = msg;
    toastNotice.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastNotice.classList.remove('show'); }, 2500);
}

// 取得當前閱讀百分比 (0 ~ 1)
function getCurrentRatio() {
    if (readingMode === 'paged') {
        if (totalPages <= 1) return 0;
        return Math.min(1, Math.max(0, currentPage / (totalPages - 1)));
    } else {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (scrollHeight <= 0) return 0;
        return Math.min(1, Math.max(0, scrollTop / scrollHeight));
    }
}

// 儲存百分比進度（同時兼容舊版 scrollTop 儲存）
function saveProgressRatio(ratio) {
    if (!currentFileKey) return;
    try {
        localStorage.setItem(`reader_ratio_${currentFileKey}`, ratio);
        if (readingMode === 'scroll') {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
            localStorage.setItem(`reader_pos_${currentFileKey}`, scrollTop);
        }
    } catch (e) {}
}

function getSavedRatio() {
    if (!currentFileKey) return 0;
    const savedRatio = localStorage.getItem(`reader_ratio_${currentFileKey}`);
    if (savedRatio !== null && !isNaN(parseFloat(savedRatio))) {
        return Math.min(1, Math.max(0, parseFloat(savedRatio)));
    }
    // 向下相容舊版像素進度
    const savedY = parseFloat(localStorage.getItem(`reader_pos_${currentFileKey}`)) || 0;
    const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    if (savedY > 0 && scrollHeight > 0) {
        return Math.min(1, Math.max(0, savedY / scrollHeight));
    }
    return 0;
}

// 計算揭頁模式的總頁數與單頁步進寬度
function recalcPagedLayout(targetRatio = null) {
    if (readingMode !== 'paged') return;

    const gap = columnCount === 1 ? 0 : 48; // 多欄時的欄間距
    textContent.style.columnCount = columnCount;
    textContent.style.webkitColumnCount = columnCount;
    textContent.style.columnGap = `${gap}px`;
    textContent.style.webkitColumnGap = `${gap}px`;

    // 先歸零以取得準確的排版寬度
    textContent.style.transform = 'translateX(0px)';

    const viewportInnerWidth = textContent.clientWidth;
    if (viewportInnerWidth <= 0) return;

    // 每一屏（包含 N 欄）的步進寬度 = 容器可視寬度 + 1 個欄間距
    pageStepWidth = viewportInnerWidth + gap;
    const totalScrollWidth = textContent.scrollWidth;

    totalPages = Math.max(1, Math.round((totalScrollWidth + gap) / pageStepWidth));

    if (targetRatio !== null) {
        currentPage = Math.round(targetRatio * (totalPages - 1));
    }
    currentPage = Math.min(totalPages - 1, Math.max(0, currentPage));
    applyPagedTransform();
}

function applyPagedTransform() {
    if (readingMode !== 'paged') return;
    const offsetX = currentPage * pageStepWidth;
    textContent.style.transform = `translate3d(-${offsetX}px, 0, 0)`;
    pageIndicator.textContent = `${currentPage + 1} / ${totalPages}`;
    updateProgressUI();
}

function goToPage(pageIndex) {
    if (readingMode !== 'paged') return;
    const clamped = Math.min(totalPages - 1, Math.max(0, pageIndex));
    if (clamped === currentPage) {
        if (pageIndex < 0) showToast('已經是第一頁');
        else if (pageIndex >= totalPages) showToast('已經是最後一頁');
        return;
    }
    currentPage = clamped;
    applyPagedTransform();
}

// 套用閱讀模式（滾動 vs 揭頁）與欄數 UI
function applyReadingMode(newMode, preserveRatio = true) {
    const ratio = preserveRatio ? getCurrentRatio() : getSavedRatio();
    readingMode = newMode;
    localStorage.setItem('reader_mode', readingMode);

    if (readingMode === 'paged') {
        document.body.classList.add('paged-mode');
        readerViewport.classList.add('paged-viewport');
        modeToggleBtn.textContent = '模式: 揭頁';
        modeToggleBtn.classList.add('active-opt');
        colSelectorGroup.style.display = 'inline-flex';
        window.scrollTo(0, 0);
        updateColButtonsUI();
        requestAnimationFrame(() => {
            recalcPagedLayout(ratio);
        });
    } else {
        document.body.classList.remove('paged-mode');
        readerViewport.classList.remove('paged-viewport');
        modeToggleBtn.textContent = '模式: 滾動';
        modeToggleBtn.classList.remove('active-opt');
        colSelectorGroup.style.display = 'none';

        textContent.style.columnCount = '';
        textContent.style.webkitColumnCount = '';
        textContent.style.columnGap = '';
        textContent.style.webkitColumnGap = '';
        textContent.style.transform = 'translateZ(0)';

        requestAnimationFrame(() => {
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            window.scrollTo(0, ratio * Math.max(0, scrollHeight));
            updateProgressUI();
        });
    }
}

function updateColButtonsUI() {
    colBtns.forEach(btn => {
        const cols = parseInt(btn.dataset.cols);
        if (cols === columnCount) {
            btn.classList.add('active-opt');
        } else {
            btn.classList.remove('active-opt');
        }
    });
}

modeToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const nextMode = readingMode === 'scroll' ? 'paged' : 'scroll';
    applyReadingMode(nextMode, true);
    showToast(nextMode === 'paged' ? `已切換至揭頁模式（${columnCount}欄）` : '已切換至無限滾動模式');
});

colBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const cols = parseInt(btn.dataset.cols);
        if (cols === columnCount) return;
        const ratio = getCurrentRatio();
        columnCount = cols;
        localStorage.setItem('reader_columns', columnCount);
        updateColButtonsUI();
        if (readingMode === 'paged') {
            recalcPagedLayout(ratio);
        }
        showToast(`排版欄數: ${columnCount} 欄`);
    });
});

// 點擊畫面控制：工具列顯示/隱藏 或 揭頁左右翻頁
document.addEventListener('click', (e) => {
    if (toolbar.contains(e.target) || shelfModal.contains(e.target) || tocModal.contains(e.target)) return;

    if (readingMode === 'paged') {
        const screenW = window.innerWidth;
        const clickX = e.clientX;
        // 左側 25% 上一頁，右側 25% 下一頁，中間 50% 切換工具列
        if (clickX < screenW * 0.25) {
            goToPage(currentPage - 1);
            return;
        } else if (clickX > screenW * 0.75) {
            goToPage(currentPage + 1);
            return;
        }
    }
    toolbar.classList.toggle('hidden');
});

// 鍵盤左右鍵 / 空白鍵 / PageUp / PageDown 翻頁
document.addEventListener('keydown', (e) => {
    if (readingMode !== 'paged') return;
    if (shelfModal.classList.contains('active') || tocModal.classList.contains('active')) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        goToPage(currentPage + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        goToPage(currentPage - 1);
    } else if (e.key === ' ') {
        e.preventDefault();
        goToPage(e.shiftKey ? currentPage - 1 : currentPage + 1);
    }
});

// 滑鼠滾輪在揭頁模式下直接前後翻頁（帶防抖）
let wheelLock = false;
window.addEventListener('wheel', (e) => {
    if (readingMode !== 'paged') return;
    if (shelfModal.classList.contains('active') || tocModal.classList.contains('active')) return;
    if (wheelLock) return;

    const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (Math.abs(delta) < 10) return;

    wheelLock = true;
    if (delta > 0) {
        goToPage(currentPage + 1);
    } else {
        goToPage(currentPage - 1);
    }
    setTimeout(() => { wheelLock = false; }, 180);
}, { passive: true });

// 視窗大小改變時重新計算分頁並維持閱讀位置
let resizeTimer;
window.addEventListener('resize', () => {
    if (readingMode !== 'paged') return;
    const ratio = getCurrentRatio();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        recalcPagedLayout(ratio);
    }, 120);
});

function updateProgressUI() {
    const ratio = getCurrentRatio();
    if (currentFileKey) saveProgressRatio(ratio);
    if (isUserDraggingSlider) return;

    const percent = ratio * 100;
    progressBtn.textContent = `${percent.toFixed(2)}%`;
    progressSlider.value = percent;
}

let scrollTimer;
window.addEventListener('scroll', () => {
    if (readingMode !== 'scroll') return;
    if (scrollTimer) cancelAnimationFrame(scrollTimer);
    scrollTimer = requestAnimationFrame(updateProgressUI);
}, { passive: true });

progressSlider.addEventListener('mousedown', () => isUserDraggingSlider = true);
progressSlider.addEventListener('touchstart', () => isUserDraggingSlider = true, { passive: true });

progressSlider.addEventListener('input', (e) => {
    const targetPercent = parseFloat(e.target.value);
    progressBtn.textContent = `${targetPercent.toFixed(2)}%`;
    const ratio = targetPercent / 100;

    if (readingMode === 'paged') {
        currentPage = Math.round(ratio * (totalPages - 1));
        applyPagedTransform();
    } else {
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        window.scrollTo(0, ratio * scrollHeight);
    }
});

progressSlider.addEventListener('mouseup', () => isUserDraggingSlider = false);
progressSlider.addEventListener('touchend', () => isUserDraggingSlider = false);

progressBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const currentVal = parseFloat(progressBtn.textContent) || 0;
    const input = prompt('請輸入跳轉進度 (0 - 100):', currentVal.toFixed(2));
    if (input !== null) {
        const targetPercent = parseFloat(input);
        if (!isNaN(targetPercent)) {
            const clamped = Math.min(100, Math.max(0, targetPercent));
            const ratio = clamped / 100;
            if (readingMode === 'paged') {
                currentPage = Math.round(ratio * (totalPages - 1));
                applyPagedTransform();
            } else {
                const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                window.scrollTo(0, ratio * scrollHeight);
                updateProgressUI();
            }
        }
    }
});

// 字體/行距調整（滾動模式帶錨點鎖定，揭頁模式自動維持百分比並重算總頁數）
function adjustStyles(type, delta) {
    const ratioBefore = getCurrentRatio();
    let anchorNode = null;
    let anchorOffset = 0;

    if (readingMode === 'scroll') {
        const range = document.caretRangeFromPoint ? document.caretRangeFromPoint(20, 100) : null;
        if (range) {
            anchorNode = range.startContainer;
            anchorOffset = range.startOffset;
        }
    }

    if (type === 'font') {
        currentFontSize = Math.max(14, Math.min(50, currentFontSize + delta));
        document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
        localStorage.setItem('reader_font_size', currentFontSize);
        showToast(`字體大小: ${currentFontSize}px`);
    } else if (type === 'line') {
        currentLineHeight = Math.max(1.0, Math.min(2.5, parseFloat((currentLineHeight + delta).toFixed(1))));
        document.documentElement.style.setProperty('--line-height', currentLineHeight);
        localStorage.setItem('reader_line_height', currentLineHeight);
        showToast(`行距大小: ${currentLineHeight}`);
    }

    requestAnimationFrame(() => {
        if (readingMode === 'paged') {
            recalcPagedLayout(ratioBefore);
        } else {
            if (anchorNode && anchorNode.nodeType === Node.TEXT_NODE) {
                try {
                    const rectRange = document.createRange();
                    rectRange.setStart(anchorNode, Math.min(anchorOffset, anchorNode.length));
                    rectRange.setEnd(anchorNode, Math.min(anchorOffset, anchorNode.length));
                    const rect = rectRange.getBoundingClientRect();
                    window.scrollBy(0, rect.top - 100);
                } catch (e) {}
            }
            updateProgressUI();
        }
    });
}

document.getElementById('fontIncBtn').addEventListener('click', (e) => { e.stopPropagation(); adjustStyles('font', 2); });
document.getElementById('fontDecBtn').addEventListener('click', (e) => { e.stopPropagation(); adjustStyles('font', -2); });
document.getElementById('lineIncBtn').addEventListener('click', (e) => { e.stopPropagation(); adjustStyles('line', 0.1); });
document.getElementById('lineDecBtn').addEventListener('click', (e) => { e.stopPropagation(); adjustStyles('line', -0.1); });

function setupDrawer(modalId, btnId, closeId) {
    const modal = document.getElementById(modalId);
    document.getElementById(btnId).addEventListener('click', (e) => {
        e.stopPropagation();
        modal.classList.add('active');
        if (modalId === 'shelfModal') renderShelf();
    });
    document.getElementById(closeId).addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
}

setupDrawer('tocModal', 'tocBtn', 'tocClose');
setupDrawer('shelfModal', 'shelfBtn', 'shelfClose');

// 優化大文本解析與記憶體流暢度（支援數百萬字 Safari）
function parseAndRenderChapters(fullText, onComplete) {
    const lines = fullText.split(/\r?\n/);
    chapterElements = [];
    textContent.innerHTML = '';

    const chapterRegex = /^\s*(?:第[0-9零一二三四五六七八九十百千萬億]+[章節回幕卷]|chapter\s*\d+|[0-9一二三四五六七八九十百]+[、\.])/i;

    const fragment = document.createDocumentFragment();
    let charCount = 0;
    const totalLen = fullText.length || 1;

    const batchSize = 2000;
    let index = 0;

    function processBatch() {
        const limit = Math.min(index + batchSize, lines.length);
        for (let i = index; i < limit; i++) {
            const line = lines[i];
            const p = document.createElement('div');
            p.textContent = line + (i < lines.length - 1 ? '\n' : '');

            const trimmed = line.trim();
            if (trimmed.length > 0 && trimmed.length < 50 && chapterRegex.test(trimmed)) {
                p.classList.add('chapter-title-node');
                const percent = ((charCount / totalLen) * 100).toFixed(2);
                chapterElements.push({
                    title: trimmed,
                    element: p,
                    percent: percent
                });
            }
            fragment.appendChild(p);
            charCount += line.length + 1;
        }
        textContent.appendChild(fragment);
        index = limit;

        if (index < lines.length) {
            requestAnimationFrame(processBatch);
        } else {
            renderToc();
            if (typeof onComplete === 'function') onComplete();
        }
    }
    processBatch();
}

function renderToc() {
    tocList.innerHTML = '';
    if (chapterElements.length === 0) {
        tocList.innerHTML = '<div class="drawer-empty">未偵測到明確的章節目錄</div>';
        tocBtn.style.display = 'none';
        return;
    }

    tocBtn.style.display = 'block';
    const fragment = document.createDocumentFragment();
    chapterElements.forEach((ch) => {
        const item = document.createElement('div');
        item.className = 'drawer-item';

        const titleSpan = document.createElement('span');
        titleSpan.textContent = ch.title;
        titleSpan.style.overflow = 'hidden';
        titleSpan.style.textOverflow = 'ellipsis';
        titleSpan.style.flex = '1';

        const percentSpan = document.createElement('span');
        percentSpan.className = 'item-subtext';
        percentSpan.textContent = `${ch.percent}%`;

        item.appendChild(titleSpan);
        item.appendChild(percentSpan);

        item.addEventListener('click', () => {
            tocModal.classList.remove('active');
            if (readingMode === 'paged') {
                // 取得該章節節點相對於 textContent 起始點的水平偏移量，精準定位到所在頁
                const contentRect = textContent.getBoundingClientRect();
                const elemRect = ch.element.getBoundingClientRect();
                const relativeLeft = elemRect.left - contentRect.left;
                const targetPage = Math.floor(relativeLeft / pageStepWidth);
                goToPage(targetPage);
            } else {
                const elementTop = ch.element.offsetTop;
                window.scrollTo(0, elementTop - 80);
                updateProgressUI();
            }
        });
        fragment.appendChild(item);
    });
    tocList.appendChild(fragment);
}

function restoreBookPosition() {
    const savedRatio = getSavedRatio();
    if (readingMode === 'paged') {
        recalcPagedLayout(savedRatio);
    } else {
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        window.scrollTo(0, savedRatio * Math.max(0, scrollHeight));
        updateProgressUI();
    }
}

async function renderShelf() {
    shelfList.innerHTML = '';
    const books = await getAllBooksFromDB();
    if (books.length === 0) {
        shelfList.innerHTML = '<div class="drawer-empty">書架目前沒有儲存的書籍</div>';
        return;
    }

    books.sort((a, b) => b.updatedAt - a.updatedAt);
    books.forEach((book) => {
        const item = document.createElement('div');
        item.className = 'drawer-item';

        const titleSpan = document.createElement('span');
        titleSpan.textContent = book.name;
        titleSpan.style.overflow = 'hidden';
        titleSpan.style.textOverflow = 'ellipsis';
        titleSpan.style.flex = '1';

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '刪除';
        delBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm(`確定要從書架刪除《${book.name}》嗎？`)) {
                await deleteBookFromDB(book.key);
                renderShelf();
            }
        });

        item.appendChild(titleSpan);
        item.appendChild(delBtn);

        item.addEventListener('click', () => {
            shelfModal.classList.remove('active');
            currentFileKey = book.key;
            statusText.textContent = '載入中...';
            parseAndRenderChapters(book.content, () => {
                restoreBookPosition();
                statusText.textContent = '';
                showToast(`已載入《${book.name}》`);
            });
        });

        shelfList.appendChild(item);
    });
}

fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    currentFileKey = `${file.name}_${file.size}`;
    statusText.textContent = '載入中...';
    textContent.innerHTML = '';
    tocBtn.style.display = 'none';

    try {
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        let encoding = 'utf-8';
        try {
            const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
            utf8Decoder.decode(uint8Array.subarray(0, 5000));
        } catch (err) {
            encoding = 'gb18030';
        }

        const decoder = new TextDecoder(encoding);
        const chunkSize = 250000;
        let offset = 0;
        let fullRawText = '';

        while (offset < uint8Array.length) {
            const chunk = uint8Array.subarray(offset, offset + chunkSize);
            const isFinal = offset + chunkSize >= uint8Array.length;
            const textChunk = decoder.decode(chunk, { stream: !isFinal });

            fullRawText += textChunk;
            offset += chunkSize;
            statusText.textContent = `${Math.min(100, Math.round((offset / uint8Array.length) * 100))}%`;
            await new Promise(r => setTimeout(r, 0));
        }

        const convertedFullText = formatQuotes(converter(fullRawText));
        saveBookToDB(currentFileKey, file.name, convertedFullText);
        toolbar.classList.remove('hidden');

        parseAndRenderChapters(convertedFullText, () => {
            const savedRatio = getSavedRatio();
            restoreBookPosition();
            if (savedRatio > 0) {
                statusText.textContent = '已恢復進度';
                setTimeout(() => { statusText.textContent = ''; }, 2000);
            } else {
                statusText.textContent = '';
            }
            showToast(`成功載入《${file.name}》`);
        });

    } catch (err) {
        console.error(err);
        statusText.textContent = '載入失敗';
    }
});

window.addEventListener('DOMContentLoaded', async () => {
    // 套用儲存的模式與欄數介面狀態
    applyReadingMode(readingMode, false);

    try {
        await initDB();
        const books = await getAllBooksFromDB();
        if (books.length > 0) {
            books.sort((a, b) => b.updatedAt - a.updatedAt);
            const lastBook = books[0];
            currentFileKey = lastBook.key;
            parseAndRenderChapters(lastBook.content, () => {
                toolbar.classList.remove('hidden');
                restoreBookPosition();
                showToast(`自動載入最近書籍: ${lastBook.name}`);
            });
        }
    } catch (e) {
        console.error('初始化書架失敗', e);
    }
});
</script>
