<style>
:root {
--bg-color: #000000;
--text-color: #e0e0e0;
--panel-bg: #000000;
--border-color: #222222;
--font-size: 26px;
--line-height: 1.4;
}

*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html {
scroll-behavior: auto !important;
background-color: var(--bg-color);
}

body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
min-height: 100vh;
overflow-x: hidden;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}

body.paged-mode {
overflow: hidden;
height: 100vh;
height: 100dvh;
}

/* 雙行頂部工具列 */
.toolbar {
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 100;
background-color: #000000;
border-bottom: 1px solid var(--border-color);
display: flex;
flex-direction: column;
gap: 6px;
padding: calc(env(safe-area-inset-top) + 8px) 10px 8px 10px;
transition: transform 0.2s ease;
}

.toolbar.hidden {
transform: translateY(-100%);
}

.toolbar-row {
display: flex;
flex-wrap: wrap;
gap: 6px;
align-items: center;
width: 100%;
}

.btn {
background-color: #1a1a1a;
color: var(--text-color);
border: 1px solid var(--border-color);
padding: 5px 9px;
border-radius: 6px;
font-size: 12px;
cursor: pointer;
user-select: none;
flex-shrink: 0;
transition: background-color 0.15s, border-color 0.15s, color 0.15s;
}

.btn:active {
opacity: 0.6;
}

.btn.active-opt {
background-color: #1b3a1e;
color: #4CAF50;
border-color: #4CAF50;
font-weight: bold;
}

.col-group {
display: inline-flex;
gap: 4px;
align-items: center;
margin-left: 2px;
padding-left: 6px;
border-left: 1px solid #333;
}

.progress-btn {
background-color: #1a1a1a;
color: #4CAF50;
border: 1px solid #4CAF50;
font-weight: bold;
flex-shrink: 0;
font-size: 12px;
padding: 5px 8px;
}

.progress-slider-container {
display: flex;
align-items: center;
flex: 1;
min-width: 100px;
}

.progress-slider {
width: 100%;
height: 4px;
-webkit-appearance: none;
appearance: none;
background: #222;
border-radius: 2px;
outline: none;
}

.progress-slider::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 16px;
height: 16px;
border-radius: 50%;
background: #4CAF50;
cursor: pointer;
}

input[type="file"] {
display: none;
}

/* 滾動模式文章內容區塊 */
.content-container {
width: 100%;
padding: calc(env(safe-area-inset-top) + 95px) 16px calc(env(safe-area-inset-bottom) + 60px) 16px;
font-size: var(--font-size);
line-height: var(--line-height);
word-break: break-word;
white-space: pre-wrap;
transform: translateZ(0);
}

/* 揭頁模式外層視窗與高效多欄分頁容器 */
.paged-viewport {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
height: 100dvh;
padding: calc(env(safe-area-inset-top) + 32px) 36px calc(env(safe-area-inset-bottom) + 36px) 36px;
overflow: hidden;
box-sizing: border-box;
}

.paged-viewport .content-container {
padding: 0;
height: 100%;
width: 100%;
column-fill: auto;
-webkit-column-fill: auto;
column-rule: 1px solid #1f1f1f;
-webkit-column-rule: 1px solid #1f1f1f;
will-change: transform;
}

.page-indicator {
position: fixed;
bottom: calc(env(safe-area-inset-bottom) + 10px);
right: 36px;
font-size: 12px;
color: #555;
pointer-events: none;
z-index: 50;
display: none;
user-select: none;
}

body.paged-mode .page-indicator {
display: block;
}

.loading-status {
font-size: 11px;
color: #aaa;
flex-shrink: 0;
}

.toast-notice {
position: fixed;
top: calc(env(safe-area-inset-top) + 100px);
right: 20px;
background-color: rgba(30, 30, 30, 0.95);
color: #fff;
padding: 8px 14px;
border-radius: 8px;
font-size: 13px;
z-index: 300;
border: 1px solid #444;
pointer-events: none;
opacity: 0;
transition: opacity 0.2s ease;
}
.toast-notice.show {

}

.drawer-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.6);
z-index: 200;
display: flex;
justify-content: flex-start;
align-items: stretch;

visibility: hidden;

.drawer-modal.active {

}

.drawer-content {
background-color: #000000;
width: 50%;
max-width: 420px;
height: 100%;
border-right: 1px solid #333;
display: flex;
flex-direction: column;
box-shadow: 4px 0 15px rgba(0,0,0,0.5);

.drawer-modal.active .drawer-content {

.drawer-header {
padding: 14px 16px;
border-bottom: 1px solid #222;
display: flex;
justify-content: space-between;
align-items: center;

color: #fff;
background-color: #000000;
}

.drawer-close {

border: none;
color: #aaa;
font-size: 18px;
cursor: pointer;
}

.drawer-list {
flex: 1;
overflow-y: auto;
padding: 4px 0;
-webkit-overflow-scrolling: touch;
}

.drawer-item {
padding: 12px 16px;
font-size: 13px;
color: #ccc;
border-bottom: 1px solid #1a1a1a;
cursor: pointer;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display: flex;
justify-content: space-between;
align-items: center;
}

.drawer-item:hover, .drawer-item:active {

color: #fff;
}

.drawer-empty {
padding: 30px;
text-align: center;
color: #666;
font-size: 13px;
}

.item-subtext {
font-size: 11px;
color: #777;
flex-shrink: 0;
}

.delete-btn {
background: #331111;
color: #ff6666;
border: 1px solid #552222;
padding: 2px 6px;
border-radius: 4px;
font-size: 11px;
cursor: pointer;
margin-left: 8px;
flex-shrink: 0;
}
.delete-btn:active {
background: #551111;
}
</style>
</head>

        <div class="drawer-header">
            <span>書架</span>
            <button class="drawer-close" id="shelfClose">&times;</button>
        </div>
        <div class="drawer-list" id="shelfList"></div>
    </div>
</div>

<script>
const DB_NAME = 'SimpleReaderDB';
const STORE_NAME = 'books';
let db = null;

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
                database.createObjectStore(STORE_NAME, { keyPath: 'key' });
            }
        };
    });
}

function saveBookToDB(key, name, content) {
    if (!db) return;
    try {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ key, name, content, updatedAt: Date.now() });
    } catch(e) {}
}

function getAllBooksFromDB() {
    return new Promise((resolve) => {
        if (!db) return resolve([]);
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
    });
}

function deleteBookFromDB(key) {
    return new Promise((resolve) => {
        if (!db) return resolve();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const req = tx.objectStore(STORE_NAME).delete(key);
        req.onsuccess = () => resolve();
        req.onerror = () => resolve();
    });
}

let currentFontSize = parseFloat(localStorage.getItem('reader_font_size')) || 26;
let currentLineHeight = parseFloat(localStorage.getItem('reader_line_height')) || 1.4;
let readingMode = localStorage.getItem('reader_mode') || 'scroll';
let columnCount = parseInt(localStorage.getItem('reader_columns')) || 2;

document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
document.documentElement.style.setProperty('--line-height', currentLineHeight);

const converter = window.OpenCC ? window.OpenCC.Converter({ from: 'cn', to: 'hk' }) : text => text;

function formatQuotes(text) {
    return text
        .replace(/“/g, '「').replace(/”/g, '」')
        .replace(/‘/g, '『').replace(/’/g, '』')
        .replace(/"([^"]+)"/g, '「$1」')
        .replace(/'([^']+)'/g, '『$1』');
}

const toolbar = document.getElementById('toolbar');
const readerViewport = document.getElementById('readerViewport');
const textContent = document.getElementById('textContent');
const fileInput = document.getElementById('fileInput');
const progressBtn = document.getElementById('progressBtn');
const progressSlider = document.getElementById('progressSlider');
const statusText = document.getElementById('statusText');
const toastNotice = document.getElementById('toastNotice');
const pageIndicator = document.getElementById('pageIndicator');

const modeToggleBtn = document.getElementById('modeToggleBtn');
const colSelectorGroup = document.getElementById('colSelectorGroup');
const colBtns = document.querySelectorAll('.col-btn');

const shelfBtn = document.getElementById('shelfBtn');
const tocBtn = document.getElementById('tocBtn');

const shelfModal = document.getElementById('shelfModal');
const shelfClose = document.getElementById('shelfClose');
const shelfList = document.getElementById('shelfList');

const tocModal = document.getElementById('tocModal');
const tocClose = document.getElementById('tocClose');
const tocList = document.getElementById('tocList');

let isUserDraggingSlider = false;
let currentFileKey = null;
let chapterElements = [];
let toastTimer = null;

let fullTextCache = '';
let chaptersData = []; // 儲存章節物件陣列：{ title, startIndex, endIndex, percent }
let currentChapterIndex = 0;
let currentPage = 0;
let totalPages = 1;
let pageStepWidth = 0;

function showToast(msg) {
    toastNotice.textContent = msg;
    toastNotice.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastNotice.classList.remove('show'); }, 2500);
}

function getCurrentRatio() {
    if (fullTextCache.length === 0) return 0;
    if (readingMode === 'paged') {
        const ch = chaptersData[currentChapterIndex];
        if (!ch) return 0;
        const chStartRatio = ch.startIndex / fullTextCache.length;
        const chEndRatio = ch.endIndex / fullTextCache.length;
        const pageRatio = totalPages > 1 ? currentPage / (totalPages - 1) : 0;
        return Math.min(1, Math.max(0, chStartRatio + (chEndRatio - chStartRatio) * pageRatio));
    } else {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (scrollHeight <= 0) return 0;
        return Math.min(1, Math.max(0, scrollTop / scrollHeight));
    }
}

function saveProgressRatio(ratio) {
    if (!currentFileKey) return;
    try {
        localStorage.setItem(`reader_ratio_${currentFileKey}`, ratio); if (readingMode === 'scroll') { const scrollTop = window.pageYOffset \vert{}\vert{} document.documentElement.scrollTop \vert{}\vert{} 0; localStorage.setItem(`reader_pos_${currentFileKey}`, scrollTop);
        }
    } catch (e) {}
}

function getSavedRatio() {
    if (!currentFileKey) return 0;
    const savedRatio = localStorage.getItem(`reader_ratio_${currentFileKey}`); if (savedRatio !== null && !isNaN(parseFloat(savedRatio))) { return Math.min(1, Math.max(0, parseFloat(savedRatio))); } const savedY = parseFloat(localStorage.getItem(`reader_pos_${currentFileKey}`)) || 0;
    const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    if (savedY > 0 && scrollHeight > 0) {
        return Math.min(1, Math.max(0, savedY / scrollHeight));
    }
    return 0;
}

// 依據進度比例找出對應的章節索引
function findChapterIndexByRatio(ratio) {
    if (chaptersData.length === 0) return 0;
    const targetChar = ratio * fullTextCache.length;
    for (let i = 0; i < chaptersData.length; i++) {
        if (targetChar >= chaptersData[i].startIndex && targetChar <= chaptersData[i].endIndex) {
            return i;
        }
    }
    return chaptersData.length - 1;
}

// 載入並渲染指定章節內容（揭頁模式核心加速機制）
function loadChapterContent(chapterIdx, targetPage = 0) {
    if (chaptersData.length === 0) return;
    currentChapterIndex = Math.min(chaptersData.length - 1, Math.max(0, chapterIdx));
    const ch = chaptersData[currentChapterIndex];

    const gap = columnCount === 1 ? 0 : 48;
    textContent.style.columnCount = columnCount;
    textContent.style.webkitColumnCount = columnCount;
    textContent.style.columnGap = `${gap}px`; textContent.style.webkitColumnGap = `${gap}px`;
    textContent.style.transform = 'translateX(0px)';

    // 只渲染當前章節文本，徹底避開 700 萬字同時排版的效能卡頓
    textContent.textContent = fullTextCache.substring(ch.startIndex, ch.endIndex);

    requestAnimationFrame(() => {
        const viewportInnerWidth = textContent.clientWidth;
        if (viewportInnerWidth <= 0) return;

        pageStepWidth = viewportInnerWidth + gap;
        const totalScrollWidth = textContent.scrollWidth;
        totalPages = Math.max(1, Math.round((totalScrollWidth + gap) / pageStepWidth));

        currentPage = Math.min(totalPages - 1, Math.max(0, targetPage));
        applyPagedTransform();
    });
}

function applyPagedTransform() {
    if (readingMode !== 'paged') return;
    const offsetX = currentPage * pageStepWidth;
    textContent.style.transform = `translate3d(-${offsetX}px, 0, 0)`; pageIndicator.textContent = `${currentPage
