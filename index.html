<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Simple Reader Mix</title>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>

<style>
:root {
--bg-color: #000000;
--text-color: #e0e0e0;
--panel-bg: #000000;
--border-color: #222222;
--font-size: 22px;
--line-height: 1.45;
--col-gap: 40px;
--page-padding: 12px;
}

*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html {
scroll-behavior: auto !important;
background-color: var(--bg-color);
}
body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
min-height: 100vh;
overflow-x: hidden;
}

/* 工具列 */
.toolbar {
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 100;
background-color: #000000;
border-bottom: 1px solid var(--border-color);
display: flex;
flex-direction: column;
gap: 6px;
padding: calc(env(safe-area-inset-top) + 8px) 10px 8px 10px;
transform: translateY(-100%);
transition: transform 0.2s ease;
}
.toolbar.show { transform: translateY(0); }
.toolbar.hidden { transform: translateY(-100%); }

.toolbar-row {
display: flex;
flex-wrap: wrap;
gap: 6px;
align-items: center;
width: 100%;
}
.btn {
background-color: #1a1a1a;
color: var(--text-color);
border: 1px solid var(--border-color);
padding: 5px 9px;
border-radius: 6px;
font-size: 12px;
cursor: pointer;
user-select: none;
flex-shrink: 0;
}
.btn:active { opacity: 0.6; }
.progress-btn {
background-color: #1a1a1a;
color: #4CAF50;
border: 1px solid #4CAF50;
font-weight: bold;
flex-shrink: 0;
font-size: 12px;
padding: 5px 8px;
}
.progress-slider-container {
display: flex;
align-items: center;
flex: 1;
min-width: 100px;
}
.progress-slider {
width: 100%;
height: 4px;
-webkit-appearance: none;
appearance: none;
background: #222;
border-radius: 2px;
outline: none;
}
.progress-slider::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 16px;
height: 16px;
border-radius: 50%;
background: #4CAF50;
cursor: pointer;
}
input[type="file"] { display: none; }

/* 揭頁模式容器 */
.reader-wrap {
width: 100%;
height: 100vh;
display: flex;
justify-content: center;
align-items: stretch;
padding: 0 16px 48px 16px;
display: none;
}
.reader-wrap.active { display: flex; }
.book-container {
display: flex;
gap: var(--col-gap);
max-width: 1400px;
width: 100%;
height: 100%;
}
.page-col {
flex: 1;
height: 100%;
border: 1px solid #222;
border-radius: 8px;
padding: var(--page-padding);
overflow: hidden;
white-space: pre-wrap;
font-size: var(--font-size);
line-height: var(--line-height);
word-break: break-word;
}
.page-footer {
position: fixed;
bottom: 8px;
left: 0;
right: 0;
display: flex;
justify-content: center;
gap: 16px;
z-index: 90;
display: none;
}
.page-footer.active { display: flex; }
.paging-btn {
padding: 8px 16px;
font-size: 14px;
}
.page-info {
color: #aaa;
font-size: 13px;
line-height: 34px;
}

/* 滾動模式容器 */
.content-container {
width: 100%;
padding: calc(env(safe-area-inset-top) + 95px) 0px calc(env(safe-area-inset-bottom) + 60px) 0px;
font-size: var(--font-size);
line-height: var(--line-height);
word-break: break-word;
white-space: pre-wrap;
transform: translateZ(0);
display: none;
-webkit-overflow-scrolling: touch;
}
.content-container.active { display: block; }

.loading-status {
font-size: 11px;
color: #aaa;
flex-shrink: 0;
}
.toast-notice {
position: fixed;
top: calc(env(safe-area-inset-top) + 100px);
right: 20px;
background-color: rgba(30, 30, 30, 0.95);
color: #fff;
padding: 8px 14px;
border-radius: 8px;
font-size: 13px;
z-index: 300;
border: 1px solid #444;
pointer-events: none;
opacity: 0;
transition: opacity 0.2s ease;
}
.toast-notice.show { opacity: 1; }

.drawer-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.6);
z-index: 200;
display: flex;
justify-content: flex-start;
align-items: stretch;
opacity: 0;
visibility: hidden;
transition: opacity 0.2s ease, visibility 0.2s ease;
}
.drawer-modal.active { opacity: 1; visibility: visible; }
.drawer-content {
background-color: #000000;
width: 420px;
height: 100%;
border-right: 1px solid #333;
display: flex;
flex-direction: column;
transform: translateX(-100%);
transition: transform 0.25s ease;
}
.drawer-modal.active .drawer-content { transform: translateX(0); }
.drawer-header {
padding: 14px 16px;
border-bottom: 1px solid #222;
display: flex;
justify-content: space-between;
align-items: center;
font-weight: bold;
font-size: 15px;
color: #fff;
}
.drawer-close {
background: none;
border: none;
color: #aaa;
font-size: 18px;
cursor: pointer;
}
.drawer-list {
flex: 1;
overflow-y: auto;
padding: 4px 0;
-webkit-overflow-scrolling: touch;
}
.drawer-item {
padding: 12px 16px;
font-size: 13px;
color: #ccc;
border-bottom: 1px solid #1a1a1a;
cursor: pointer;
display: flex;
justify-content: space-between;
align-items: center;
}
.drawer-item:active { background-color: #222; color: #fff; }
.drawer-empty {
padding: 30px;
text-align: center;
color: #666;
font-size: 13px;
}
.item-subtext {
font-size: 11px;
color: #777;
flex-shrink: 0;
}
.delete-btn {
background: #331111;
color: #ff6666;
border: 1px solid #552222;
padding: 2px 6px;
border-radius: 4px;
font-size: 11px;
cursor: pointer;
margin-left: 8px;
flex-shrink: 0;
}
.delete-btn:active { background: #551111; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
<div class="toolbar-row">
<label class="btn" for="fileInput">📁 開啟檔案</label>
<input type="file" id="fileInput" accept=".txt,.html,.md,.text">
<button class="btn" id="shelfBtn">📚 書架</button>
<button class="btn" id="tocBtn" style="display:none;">📑 目錄</button>
<button class="btn" id="modeToggleBtn">🔄 切換模式</button>
<button class="btn" id="fontIncBtn">字體+</button>
<button class="btn" id="fontDecBtn">字體-</button>
<button class="btn" id="lineIncBtn">行距+</button>
<button class="btn" id="lineDecBtn">行距-</button>
</div>
<div class="toolbar-row">
<button class="btn progress-btn" id="progressBtn">0.00%</button>
<div class="progress-slider-container">
<input type="range" class="progress-slider" id="progressSlider" min="0" max="100" step="0.1" value="0">
</div>
<span class="loading-status" id="statusText"></span>
</div>
</div>

<div class="reader-wrap" id="flipWrap">
<div class="book-container">
<div class="page-col" id="leftPage">請點擊上方「開啟檔案」或從「書架」載入文章...</div>
<div class="page-col" id="rightPage"></div>
</div>
</div>

<div class="content-container" id="scrollContent">
請點擊上方「開啟檔案」或從「書架」載入文章...
</div>

<div class="page-footer" id="pageFooter">
<button class="btn paging-btn" id="prevBtn">← 上一頁</button>
<span class="page-info" id="pageInfo">-- / --</span>
<button class="btn paging-btn" id="nextBtn">下一頁 →</button>
</div>

<div class="toast-notice" id="toastNotice"></div>

<div class="drawer-modal" id="tocModal">
<div class="drawer-content">
<div class="drawer-header"><span>章節</span><button class="drawer-close" id="tocClose">&times;</button></div>
<div class="drawer-list" id="tocList"></div>
</div>
</div>
<div class="drawer-modal" id="shelfModal">
<div class="drawer-content">
<div class="drawer-header"><span>書架</span><button class="drawer-close" id="shelfClose">&times;</button></div>
<div class="drawer-list" id="shelfList"></div>
</div>
</div>

<script>
const DB_NAME = 'SimpleReaderDB';
const STORE_NAME = 'books';
let db = null;
let fullText = "";
let pageList = [];
let currentCharOffset = 0;
let wheelLock = false;
let resizeTimer = null;
let scrollTimer = null;
// readerMode: flip | scroll
let readerMode = localStorage.getItem('readerMode') || 'flip';

function initDB() {
return new Promise((resolve, reject) => {
const request = indexedDB.open(DB_NAME, 1);
request.onerror = () => reject(request.error);
request.onsuccess = () => { db = request.result; resolve(db); };
request.onupgradeneeded = (e) => {
const database = e.target.result;
if (!database.objectStoreNames.contains(STORE_NAME)) {
database.createObjectStore(STORE_NAME, { keyPath: 'key' });
}
};
});
}
function saveBookToDB(key, name, content) {
if (!db) return;
try {
const tx = db.transaction(STORE_NAME, 'readwrite');
tx.objectStore(STORE_NAME).put({ key, name, content, updatedAt: Date.now() });
} catch(e) {}
}
function getAllBooksFromDB() {
return new Promise((resolve) => {
if (!db) return resolve([]);
const tx = db.transaction(STORE_NAME, 'readonly');
const req = tx.objectStore(STORE_NAME).getAll();
req.onsuccess = () => resolve(req.result || []);
req.onerror = () => resolve([]);
});
}
function deleteBookFromDB(key) {
return new Promise((resolve) => {
if (!db) return resolve();
const tx = db.transaction(STORE_NAME, 'readwrite');
const req = tx.objectStore(STORE_NAME).delete(key);
req.onsuccess = () => resolve();
req.onerror = () => resolve();
});
}

let currentFontSize = parseFloat(localStorage.getItem('reader_font_size')) || 22;
let currentLineHeight = parseFloat(localStorage.getItem('reader_line_height')) || 1.45;
document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
document.documentElement.style.setProperty('--line-height', currentLineHeight);

const converter = window.OpenCC ? window.OpenCC.Converter({ from: 'cn', to: 'hk' }) : text => text;
function formatQuotes(text) {
return text
.replace(/“/g, '「').replace(/”/g, '」')
.replace(/‘/g, '『').replace(/’/g, '』')
.replace(/"([^"]+)"/g, '「$1」')
.replace(/'([^']+)'/g, '『$1』');
}

const toolbar = document.getElementById('toolbar');
const flipWrap = document.getElementById('flipWrap');
const scrollContent = document.getElementById('scrollContent');
const leftPage = document.getElementById('leftPage');
const rightPage = document.getElementById('rightPage');
const pageFooter = document.getElementById('pageFooter');
const fileInput = document.getElementById('fileInput');
const progressBtn = document.getElementById('progressBtn');
const progressSlider = document.getElementById('progressSlider');
const statusText = document.getElementById('statusText');
const toastNotice = document.getElementById('toastNotice');
const shelfBtn = document.getElementById('shelfBtn');
const tocBtn = document.getElementById('tocBtn');
const modeToggleBtn = document.getElementById('modeToggleBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageInfo = document.getElementById('pageInfo');
const shelfModal = document.getElementById('shelfModal');
const shelfClose = document.getElementById('shelfClose');
const shelfList = document.getElementById('shelfList');
const tocModal = document.getElementById('tocModal');
const tocClose = document.getElementById('tocClose');
const tocList = document.getElementById('tocList');

let isUserDraggingSlider = false;
let currentFileKey = null;
let chapterElements = [];
let toastTimer = null;

function showToast(msg) {
toastNotice.textContent = msg;
toastNotice.classList.add('show');
if (toastTimer) clearTimeout(toastTimer);
toastTimer = setTimeout(() => { toastNotice.classList.remove('show'); }, 2500);
}

function saveProgressOffset(offset) {
if (!currentFileKey) return;
try { localStorage.setItem(`reader_pos_${currentFileKey}_offset`, offset); } catch (e) {}
}
function getSavedOffset() {
if (!currentFileKey) return 0;
return parseInt(localStorage.getItem(`reader_pos_${currentFileKey}_offset`)) || 0;
}
function saveProgressScroll(y) {
if (!currentFileKey) return;
try { localStorage.setItem(`reader_pos_${currentFileKey}_scroll`, y); } catch (e) {}
}
function getSavedScroll() {
if (!currentFileKey) return 0;
return parseFloat(localStorage.getItem(`reader_pos_${currentFileKey}_scroll`)) || 0;
}

// ===== 揭頁模式函數 =====
function getDynamicCharsPerPage() {
const colWidth = leftPage.clientWidth - 24;
const colHeight = leftPage.clientHeight - 24;
const charsPerLine = Math.floor(colWidth / currentFontSize);
const linesPerPage = Math.floor(colHeight / (currentFontSize * currentLineHeight));
return Math.max(100, Math.floor(charsPerLine * linesPerPage * 0.85));
}
function splitTextToPages(text) {
const pages = [];
let ptr = 0;
const perPage = getDynamicCharsPerPage();
while(ptr < text.length) {
let end = ptr + perPage;
if(end >= text.length) {
pages.push(text.slice(ptr));
break;
}
let brPos = text.indexOf('\n', end);
if(brPos === -1) brPos = end;
pages.push(text.slice(ptr, brPos+1));
ptr = brPos + 1;
}
return pages;
}
function charOffsetToPageIndex(offset) {
if (!pageList.length) return 0;
let ptr = 0;
for(let i=0;i<pageList.length;i++){
if(offset >= ptr && offset < ptr + pageList[i].length){
return i;
}
ptr += pageList[i].length;
}
return pageList.length -1;
}
function renderByOffset() {
if(!pageList.length) return;
let ptr = 0;
let targetPage = 0;
for(let i=0;i<pageList.length;i++){
if(currentCharOffset >= ptr && currentCharOffset < ptr + pageList[i].length){
targetPage = i;
break;
}
ptr += pageList[i].length;
}
leftPage.textContent = pageList[targetPage];
rightPage.textContent = (targetPage+1 < pageList.length) ? pageList[targetPage+1] : "";
updateProgressUI();
}
function goPageDelta(delta) {
const currentPage = charOffsetToPageIndex(currentCharOffset);
const nextPage = Math.max(0, Math.min(currentPage + delta, pageList.length - 1));
let ptr = 0;
for(let i=0;i<nextPage;i++) ptr += pageList[i].length;
currentCharOffset = ptr;
renderByOffset();
}

// ===== 滾動模式：文字渲染，紀錄每段 charStart =====
let scrollLineMeta = [];
function parseAndRenderScroll(text) {
scrollContent.innerHTML = '';
scrollLineMeta = [];
const lines = text.split(/\r?\n/);
const fragment = document.createDocumentFragment();
let charPtr = 0;
const batchSize = 2000;
let idx = 0;
function batch(){
const limit = Math.min(idx + batchSize, lines.length);
for(let i=idx;i<limit;i++){
const line = lines[i];
const p = document.createElement('div');
p.textContent = line + (i<lines.length-1 ? '\n':'');
scrollLineMeta.push({el:p, start:charPtr});
fragment.appendChild(p);
charPtr += line.length + 1;
}
scrollContent.appendChild(fragment);
idx = limit;
if(idx < lines.length) requestAnimationFrame(batch);
}
batch();
}
// 由 charOffset 搵滾動位置
function scrollToCharOffset(offset){
if(!scrollLineMeta.length) return;
let targetEl = scrollLineMeta[0].el;
for(let m of scrollLineMeta){
if(offset >= m.start) targetEl = m.el;
else break;
}
targetEl.scrollIntoView({block:'start'});
window.scrollBy(0,-90);
}
// 由當前滾動位置，反推最近 charOffset
function getCurrentCharOffsetFromScroll(){
const rect = scrollContent.getBoundingClientRect();
const ratio = Math.max(0, Math.min(1, (window.scrollY - rect.top + 90) / rect.height));
return Math.floor(ratio * fullText.length);
}

// ===== 共用目錄解析（統一 charPos） =====
function parseChaptersForToc(text) {
chapterElements = [];
const chapterRegex = /第([0-9零一二三四五六七八九十百千萬億]+)(節|章|回|卷|幕)([^\n]*)/g;
let match;
while ((match = chapterRegex.exec(text)) !== null) {
const titleRaw = match[0].trim();
const titleStart = match.index;
const percent = (titleStart / text.length) * 100;
chapterElements.push({
title: titleRaw,
charPos: titleStart,
percent: percent
});
}
}
function renderToc() {
tocList.innerHTML = '';
if (chapterElements.length === 0) {
tocList.innerHTML = '<div class="drawer-empty">未偵測到明確的章節目錄</div>';
tocBtn.style.display = 'none';
return;
}
tocBtn.style.display = 'block';
chapterElements.forEach((ch)=>{
const item = document.createElement('div');
item.className = 'drawer-item';
item.innerHTML = `<span>${ch.title}</span><span class="item-subtext">${ch.percent.toFixed(1)}%</span>`;
item.onclick = ()=>{
tocModal.classList.remove('active');
currentCharOffset = ch.charPos;
if(readerMode === 'flip'){
renderByOffset();
}else{
scrollToCharOffset(currentCharOffset);
}
};
tocList.appendChild(item);
})
}

// ===== 進度UI =====
function updateProgressUI() {
if (!fullText) return;
if(readerMode === 'flip'){
const percent = fullText.length === 0 ? 0 : (currentCharOffset / fullText.length) * 100;
progressBtn.textContent = `${percent.toFixed(2)}%`;
progressSlider.value = percent;
const pageIdx = charOffsetToPageIndex(currentCharOffset);
pageInfo.textContent = `${pageIdx+1} / ${pageList.length}`;
saveProgressOffset(currentCharOffset);
}else{
const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
saveProgressScroll(scrollTop);
if (isUserDraggingSlider) return;
const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
if (scrollHeight <= 0) {
progressBtn.textContent = '0.00%';
progressSlider.value = 0;
return;
}
const percent = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
progressBtn.textContent = `${percent.toFixed(2)}%`;
progressSlider.value = percent;
}
}

// ===== 切換模式 =====
function applyModeUI(){
if(readerMode === 'flip'){
flipWrap.classList.add('active');
scrollContent.classList.remove('active');
pageFooter.classList.add('active');
modeToggleBtn.textContent = '🔄 切換：滾動';
toolbar.classList.add('show');
}else{
flipWrap.classList.remove('active');
scrollContent.classList.add('active');
pageFooter.classList.remove('active');
modeToggleBtn.textContent = '🔄 切換：揭頁';
}
localStorage.setItem('readerMode', readerMode);
}
function switchMode(){
if(!fullText){
showToast('請先載入書籍');
return;
}
if(readerMode === 'flip'){
// flip -> scroll：記住 currentCharOffset，渲染滾動DOM，跳去對應位置
readerMode = 'scroll';
parseAndRenderScroll(fullText);
scrollToCharOffset(currentCharOffset);
}else{
// scroll -> flip：由滾動位置讀返 charOffset，重新分頁渲染
readerMode = 'flip';
currentCharOffset = getCurrentCharOffsetFromScroll();
pageList = splitTextToPages(fullText);
renderByOffset();
}
parseChaptersForToc(fullText);
renderToc();
applyModeUI();
updateProgressUI();
showToast(`已切換至${readerMode==='flip'?'揭頁模式':'滾動模式'}`);
}

// ===== 字體行距調整 =====
function adjustStyles(type, delta) {
if (type === 'font') {
currentFontSize = Math.max(14, Math.min(40, currentFontSize + delta));
document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
localStorage.setItem('reader_font_size', currentFontSize);
showToast(`字體大小: ${currentFontSize}px`);
} else if (type === 'line') {
currentLineHeight = Math.max(1.0, Math.min(2.2, parseFloat((currentLineHeight + delta).toFixed(1))));
document.documentElement.style.setProperty('--line-height', currentLineHeight);
localStorage.setItem('reader_line_height', currentLineHeight);
showToast(`行距大小: ${currentLineHeight}`);
}
if(!fullText) return;
if(readerMode === 'flip'){
pageList = splitTextToPages(fullText);
renderByOffset();
}else{
parseAndRenderScroll(fullText);
scrollToCharOffset(currentCharOffset);
}
parseChaptersForToc(fullText);
renderToc();
updateProgressUI();
}

// ===== 事件綁定 =====
prevBtn.onclick = () => goPageDelta(-2);
nextBtn.onclick = () => goPageDelta(2);
document.addEventListener('keydown', e=>{
if(readerMode !== 'flip') return;
if(e.key === 'ArrowLeft') goPageDelta(-2);
if(e.key === 'ArrowRight') goPageDelta(2);
});
document.addEventListener('wheel', (e) => {
if(readerMode !== 'flip') return;
if (wheelLock) return;
if (shelfModal.classList.contains('active') || tocModal.classList.contains('active')) return;
e.preventDefault();
wheelLock = true;
if (e.deltaY > 0) {
goPageDelta(2);
} else {
goPageDelta(-2);
}
setTimeout(() => wheelLock = false, 180);
}, { passive: false });

window.addEventListener('resize', () => {
if(readerMode !== 'flip') return;
clearTimeout(resizeTimer);
resizeTimer = setTimeout(() => {
if (fullText) {
pageList = splitTextToPages(fullText);
renderByOffset();
}
}, 250);
});

window.addEventListener('scroll', () => {
if(readerMode !== 'scroll') return;
if (scrollTimer) cancelAnimationFrame(scrollTimer);
scrollTimer = requestAnimationFrame(updateProgressUI);
}, { passive: true });

progressSlider.addEventListener('mousedown', () => isUserDraggingSlider = true);
progressSlider.addEventListener('touchstart', () => isUserDraggingSlider = true, { passive: true });
progressSlider.addEventListener('input', (e) => {
const targetPercent = parseFloat(e.target.value);
if(readerMode === 'flip'){
currentCharOffset = Math.floor(targetPercent / 100 * fullText.length);
renderByOffset();
}else{
progressBtn.textContent = `${targetPercent.toFixed(2)}%`;
const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
window.scrollTo(0, (targetPercent / 100) * scrollHeight);
}
});
progressSlider.addEventListener('mouseup', () => isUserDraggingSlider = false);
progressSlider.addEventListener('touchend', () => isUserDraggingSlider = false);
progressBtn.addEventListener('click', (e) => {
e.stopPropagation();
if(readerMode === 'flip'){
const input = prompt('輸入跳轉頁數', charOffsetToPageIndex(currentCharOffset)+1);
if(input === null) return;
const p = parseInt(input)-1;
if(isNaN(p) || p <0 || p >= pageList.length) return;
let ptr =0;
for(let i=0;i<p;i++) ptr += pageList[i].length;
currentCharOffset = ptr;
renderByOffset();
}else{
const currentVal = parseFloat(progressBtn.textContent) || 0;
const input = prompt('請輸入跳轉進度 (0 - 100):', currentVal.toFixed(2));
if (input !== null) {
const targetPercent = parseFloat(input);
if (!isNaN(targetPercent)) {
const clamped = Math.min(100, Math.max(0, targetPercent));
const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
window.scrollTo(0, (clamped / 100) * scrollHeight);
updateProgressUI();
}
}
}
});

document.getElementById('fontIncBtn').addEventListener('click', (e) => { e.stopPropagation(); adjustStyles('font', 2); });
document.getElementById('fontDecBtn').addEventListener('click', (e) => { e.stopPropagation(); adjustStyles('font', -2); });
document.getElementById('lineIncBtn').addEventListener('click', (e) => { e.stopPropagation(); adjustStyles('line', 0.1); });
document.getElementById('lineDecBtn').addEventListener('click', (e) => { e.stopPropagation(); adjustStyles('line', -0.1); });
modeToggleBtn.onclick = (e)=>{ e.stopPropagation(); switchMode(); };

document.addEventListener('click', (e) => {
if (toolbar.contains(e.target) || shelfModal.contains(e.target) || tocModal.contains(e.target)
|| prevBtn.contains(e.target) || nextBtn.contains(e.target)) return;
toolbar.classList.toggle('show');
});

function setupDrawer(modalId, btnId, closeId) {
const modal = document.getElementById(modalId);
document.getElementById(btnId).addEventListener('click', (e) => {
e.stopPropagation();
modal.classList.add('active');
if (modalId === 'shelfModal') renderShelf();
});
document.getElementById(closeId).addEventListener('click', () => modal.classList.remove('active'));
modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
}
setupDrawer('tocModal', 'tocBtn', 'tocClose');
setupDrawer('shelfModal', 'shelfBtn', 'shelfClose');

async function renderShelf() {
shelfList.innerHTML = '';
const books = await getAllBooksFromDB();
if (books.length === 0) {
shelfList.innerHTML = '<div class="drawer-empty">書架目前沒有儲存的書籍</div>';
return;
}
books.sort((a, b) => b.updatedAt - a.updatedAt);
books.forEach((book) => {
const item = document.createElement('div');
item.className = 'drawer-item';
const titleSpan = document.createElement('span');
titleSpan.textContent = book.name;
const delBtn = document.createElement('button');
delBtn.className = 'delete-btn';
delBtn.textContent = '刪除';
delBtn.onclick = async (e) => {
e.stopPropagation();
if(confirm(`確定刪除《${book.name}》？`)) {
await deleteBookFromDB(book.key);
renderShelf();
}
};
item.appendChild(titleSpan);
item.appendChild(delBtn);
item.onclick = () => {
shelfModal.classList.remove('active');
currentFileKey = book.key;
statusText.textContent = '載入中...';
fullText = book.content;
parseChaptersForToc(fullText);
renderToc();
if(readerMode === 'flip'){
pageList = splitTextToPages(fullText);
currentCharOffset = getSavedOffset();
renderByOffset();
}else{
parseAndRenderScroll(fullText);
const sy = getSavedScroll();
window.scrollTo(0, sy);
}
statusText.textContent = '';
showToast(`已載入《${book.name}》`);
};
shelfList.appendChild(item);
});
}

fileInput.addEventListener('change', async (e) => {
const file = e.target.files[0];
if (!file) return;
currentFileKey = `${file.name}_${file.size}`;
statusText.textContent = '載入中...';
try {
const arrayBuffer = await file.arrayBuffer();
const uint8Array = new Uint8Array(arrayBuffer);
let encoding = 'utf-8';
try {
const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
utf8Decoder.decode(uint8Array.subarray(0, 5000));
} catch (err) { encoding = 'gb18030'; }
const decoder = new TextDecoder(encoding);
const chunkSize = 250000;
let offset = 0;
let fullRawText = '';
while (offset < uint8Array.length) {
const chunk = uint8Array.subarray(offset, offset + chunkSize);
const isFinal = offset + chunkSize >= uint8Array.length;
const textChunk = decoder.decode(chunk, { stream: !isFinal });
fullRawText += textChunk;
offset += chunkSize;
statusText.textContent = `${Math.min(100, Math.round((offset / uint8Array.length) * 100))}%`;
await new Promise(r => setTimeout(r, 0));
}
fullText = formatQuotes(converter(fullRawText));
parseChaptersForToc(fullText);
renderToc();
saveBookToDB(currentFileKey, file.name, fullText);
if(readerMode === 'flip'){
pageList = splitTextToPages(fullText);
currentCharOffset = getSavedOffset();
renderByOffset();
}else{
parseAndRenderScroll(fullText);
const sy = getSavedScroll();
window.scrollTo(0, sy);
}
statusText.textContent = '';
showToast(`成功載入《${file.name}》`);
} catch (err) {
console.error(err);
statusText.textContent = '載入失敗';
}
});

window.addEventListener('DOMContentLoaded', async () => {
applyModeUI();
try {
await initDB();
const books = await getAllBooksFromDB();
if (books.length > 0) {
books.sort((a, b) => b.updatedAt - a.updatedAt);
const lastBook = books[0];
currentFileKey = lastBook.key;
fullText = lastBook.content;
parseChaptersForToc(fullText);
renderToc();
if(readerMode === 'flip'){
pageList = splitTextToPages(fullText);
currentCharOffset = getSavedOffset();
renderByOffset();
}else{
parseAndRenderScroll(fullText);
const sy = getSavedScroll();
window.scrollTo(0, sy);
}
showToast(`自動載入最近書籍: ${lastBook.name}`);
}
} catch (e) {
console.error('初始化書架失敗', e);
}
});
</script>
